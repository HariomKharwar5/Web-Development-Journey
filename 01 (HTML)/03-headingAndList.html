<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lorem ipsum dolor sit amet.</h1>
    <h2>Lorem ipsum dolor sit <em>amet consectetur</em>  adipisicing.</h2>
    <p>Lorem ipsum <strong>dolor</strong> sit amet.</p>
    <ol>
        <li>Apple</li>
        <li>Mango</li>
        <li>Grapes</li>
    </ol>
    <h1>BLock Level Elements</h1>
    <div>
        <ul>
        <li>heading h1 to h6</li>
        <li>ol,li</li>
        <li>p</li>
    </ul>
    </div>
    <div>
        <h1>Inline Elements</h1>
        <ul>
            <li>anchor tag</li>
            <li>img</li>
            <li>strong</li>
            <li>em</li>
        </ul>
    </div>
</body>
</html>
